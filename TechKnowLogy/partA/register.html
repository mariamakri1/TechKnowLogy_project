<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>TechKnowLogy -Εγγραφή Χρήστη</title>
  
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">

</head>

  <header>
          <div class="header-inner">
            <a href="index.html" class="logo">
              <img src="assets/images/logo.png" alt="TechKnowLogy">
            </a>

           <nav id="main-nav">
            <button id="menu-toggle" aria-expanded="false">☰</button>
            <ul class="menu">
              <li><a href="index.html">Αρχική</a></li>
              <li><a href="courses.html">Μαθήματα</a></li>
              <li><a href="books.html">Βιβλία</a></li>
              <li><a href="about.html">Ποιοι Είμαστε</a></li>
            </ul>
          </nav> 
        </div>
          <!-- Πλαίσιο με Εγγραφή / Σύνδεση κάτω από το logo -->
            <div class="header-actions">
              <a href="register.html" class="register-btn">Εγγραφή</a>
              <span class="divider">/</span>
              <a href="login.html" class="login-btn">Σύνδεση</a>
            </div>
        </header>

    <main class="form-page">
            
    <section class="form-container">
    <form id="registerForm" class="form-card">

        <h2>Εγγραφή Χρήστη</h2>

        <!-- A. Βασικά στοιχεία -->
        <label>Ονοματεπώνυμο</label>
        <input type="text" id="fullname" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Ημερομηνία Γέννησης</label>
        <input type="date" id="birthdate" required>

        <h3>Φύλο</h3>
            <div class="form-row">
            <label>
                <input type="radio" name="gender" value="Άνδρας" required>
                    Άνδρας
            </label>

            <label>
                <input type="radio" name="gender" value="Γυναίκα">
                    Γυναίκα
            </label>

            <label>
                 <input type="radio" name="gender" value="Άλλο">
                     Άλλο
            </label>
            </div>

        <!-- B. Στοιχεία λογαριασμού -->
        <label>Όνομα Χρήστη</label>
        <input type="text" id="regUsername" required minlength="4">

        <label>Κωδικός</label>
        <input type="password" id="regPassword" 
            required 
            pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$"
            title="Τουλάχιστον 8 χαρακτήρες, 1 κεφαλαίο, 1 αριθμό">

        <label>Επιβεβαίωση Κωδικού</label>
        <input type="password" id="confirmPassword" required>

        <!-- C. Ενδιαφέροντα -->
        <h3>Ενδιαφέροντα</h3>
        <div class="checkbox-list">
            <label>
                <input type="checkbox" name="interests" value="Προγραμματισμός">
                Προγραμματισμός
            </label>

            <label>
                <input type="checkbox" name="interests" value="Δίκτυα">
                Δίκτυα
            </label>

            <label>
                <input type="checkbox" name="interests" value="Ασφάλεια">
                Ασφάλεια
            </label>

            <label>
                <input type="checkbox" name="interests" value="Βάσεις Δεδομένων">
                Βάσεις Δεδομένων
            </label>
        </div>

        <!-- D. Εμπειρία -->
        <h3>Εμπειρία</h3>
        <select id="experience" required>
            <option value="">--Επίλεξε--</option>
            <option value="Αρχάριος">Αρχάριος</option>
            <option value="Μεσαίος">Μεσαίος</option>
            <option value="Προχωρημένος">Προχωρημένος</option>
        </select>

        <!-- Στόχος -->
        <label>Στόχος Μάθησης</label>
        <select id="goal" required>
            <option value="">--Επίλεξε--</option>
            <option value="Εύρεση Εργασίας">Εύρεση Εργασίας</option>
            <option value="Βελτίωση Δεξιοτήτων">Βελτίωση δεξιοτήτων</option>
            <option value="Hobby">Hobby</option>
        </select>

        <button type="submit"class="banner-btn">Υποβολή</button>

        
        <p id="registerMessage"></p>
       
    </section>
    </form>
    
</main>

        <!-- Modal -->
                <div id="modal" class="modal">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                    </div>
                </div>
        
        <script src="assets/js/forms/users.js"></script>
        <script src="assets/js/data/courses.js"></script>
        <script src="assets/js/data/books.js"></script>
        <script src="assets/js/data/videos.js"></script>
        <script src="assets/js/ui/app.js"></script>
        <script src="assets/js/ui/menu.js"></script>
        <script src="assets/js/ui/responsive.js"></script>
        <script src="assets/js/ui/book-filter.js"></script>

        
</body>

</html>
