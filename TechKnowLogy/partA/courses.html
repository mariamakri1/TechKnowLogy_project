<!DOCTYPE html>
<html lang="el">
    <head>
        <meta charset="utf-8" />
        <title> TechKnowLogy - Μαθήματα</title>
      <link rel="stylesheet" href="assets/css/reset.css">
        <link rel="stylesheet" href="assets/css/theme.css">
        <link rel="stylesheet" href="assets/css/layout.css">
        <link rel="stylesheet" href="assets/css/components.css">
    </head> 

    <body>
        
     <header>
          <div class="header-inner">
            <a href="index.html" class="logo">
              <img src="assets/images/logo.png" alt="TechKnowLogy">
            </a>

           <nav id="main-nav">
            <button id="menu-toggle" aria-expanded="false">☰</button>
            <ul class="menu">
              <li><a href="index.html">Αρχική</a></li>
              <li><a href="courses.html">Μαθήματα</a></li>
              <li><a href="books.html">Βιβλία</a></li>
              <li><a href="about.html">Ποιοι Είμαστε</a></li>
            </ul>
          </nav> 
        </div>
       
            <div class="header-actions">
              <a href="register.html" class="register-btn">Εγγραφή</a>
              <span class="divider">/</span>
              <a href="login.html" class="login-btn">Σύνδεση</a>
            </div>
        </header>

      <section class="courses-banner"></section>

        <main>
           
            <section class="page-title">
                <h2> Όλα τα Μαθήματα</h2>
                <p>Εξερευνήστε τις κατηγορίες μαθημάτων Πληροφορικής.</p>
            </section>
            

            <!--filters for courses-->
            <section class="filters">
                <h3>Φίλτρα</h3>
            <input type="text" id="searchInput" placeholder="Αναζήτηση μαθήματος...">

            <select id="categoryFilter">
                <option value="">Όλες οι κατηγορίες</option>
                <option value="Προγραμματισμός">Προγραμματισμός</option>
                <option value="Δίκτυα">Δίκτυα</option>
                <option value="Ασφάλεια">Ασφάλεια</option>
                <option value="Βάσεις Δεδομένων">Βάσεις Δεδομένων</option>
            </select>

            <select id="levelFilter">
                <option value="">Όλα τα επίπεδα</option>
                <option value="Αρχάριος">Αρχάριος</option>
                <option value="Μεσαίο">Μεσαίο</option>
                <option value="Προχωρημένο">Προχωρημένο</option>
            </select>

            <label>
                <input type="checkbox" id="availableOnly">
                Μόνο διαθέσιμα
            </label>
            </section>

            <section class="course-list">
                <h3>Λίστα Μαθημάτων</h3>
            </section>
            <section id="coursesContainer" class="course-list"></section>

            <script src="assets/js/data/courses.js"></script>
            <script src="assets/js/ui/courses-filter.js"></script>

        </main>


                <!-- Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
            </div>
        </div>

        <script src="assets/js/data/courses.js"></script>
        <script src="assets/js/data/books.js"></script>
        <script src="assets/js/data/videos.js"></script>
        <script src="assets/js/app.js"></script>
        <script src="assets/js/ui/menu.js"></script>
        <script src="assets/js/ui/responsive.js"></script>
        <script src="assets/js/ui/book-filter.js"></script>

    </body>

        </footer>
